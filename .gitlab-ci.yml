stages:
  - lint
  - test
  - validate

default:
  image: python:3.12-slim
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install ruff
    - export PYTHONPATH="$CI_PROJECT_DIR"

lint:
  stage: lint
  script:
    - ruff check src tests dags

unit_tests:
  stage: test
  script:
    - pytest tests/ -v -m "not spark"

dag_validation:
  stage: validate
  script:
    - pytest tests/test_airflow_dag.py -v